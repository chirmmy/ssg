<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Chi monogram：C 是一段右侧开口的大圆弧，怀抱住缩小的「hi」——
       「C 里住着 hi」既是名字，也像一枚打招呼的对话气泡。
       渐变与首页头像 / Hero 标题同一套（#2563eb → #7c3aed）；
       i 的点用浅粉 #fbcfe8 点缀，呼应 Hero 标题的第三色 #ec4899。
       字母全部用路径绘制（monoline 圆头笔画），不依赖系统字体。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- C：怀抱 -->
  <path d="M 22.53 10.27 A 9.3 9.3 0 1 0 22.53 21.73"
        fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <!-- hi：住在 C 里 -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 11.9 11.8 V 20.4"/>
    <path d="M 11.9 16.6 C 11.9 14.2 13.4 13.4 14.6 13.4 C 16 13.4 17.1 14.4 17.1 16.5 V 20.4"/>
    <path d="M 19.3 13.4 V 20.4"/>
  </g>
  <!-- i 的点：打招呼时扬起的那一下 -->
  <circle cx="19" cy="11.1" r="1.2" fill="#fbcfe8"/>
</svg>
