{{define "post"}}<!DOCTYPE html>
<html lang="{{.Site.Config.Site.Language}}">
<head>{{template "head" .}}</head>
<body>
  <canvas class="post-starfield" data-starfield aria-hidden="true"></canvas>
  <div class="reading-progress" data-reading-progress aria-hidden="true"></div>
  <a href="#main" class="skip-link">跳到主内容</a>
  {{template "header" .}}
  <main id="main" class="main--wide main--framed" tabindex="-1">
    {{template "breadcrumb" (dict "Section" "博客" "SectionURL" "/blog/" "Title" .Post.Title "BackURL" "/blog/")}}
    <article class="post" data-reading-source>
      <h1 class="enter">{{.Post.Title}}</h1>
      <div class="enter" data-enter-delay="1">{{template "post-meta" .Post}}</div>

      <div class="toc" data-toc></div>

      <div class="content" data-toc-source>
        {{.Post.Body}}
      </div>
    </article>
  </main>
  {{template "footer" .}}
  <aside class="toc-rail" data-toc-rail aria-label="文章目录"></aside>
  <script src="{{asset "starfield.js"}}" defer></script>
  <script src="{{asset "code.js"}}" defer></script>
  <script src="{{asset "toc.js"}}" defer></script>
  <script src="{{asset "reading-progress.js"}}" defer></script>
</body>
</html>{{end}}
