{{define "404"}}<!DOCTYPE html>
<html lang="{{.Site.Config.Site.Language}}">
<head>{{template "head" .}}</head>
<body>
  <a href="#main" class="skip-link">跳到主内容</a>
  {{template "header" .}}
  <main id="main" tabindex="-1">
    <div class="page-404">
      <p class="page-404__code" aria-hidden="true">404</p>
      <h1 class="page-404__title">{{.Page.Title}}</h1>
      <p class="page-404__desc">{{.Page.Description}}</p>
      <div class="actions">
        <a href="/" class="btn">回到首页</a>
        <a href="/blog/" class="btn ghost">浏览博客</a>
      </div>
    </div>
  </main>
  {{template "footer" .}}
</body>
</html>{{end}}
