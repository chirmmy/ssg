{{define "blog-index"}}<!DOCTYPE html>
<html lang="{{.Site.Config.Site.Language}}">
<head>{{template "head" .}}</head>
<body>
  <a href="#main" class="skip-link">跳到主内容</a>
  {{template "header" .}}
  <main id="main" tabindex="-1">
    <h1 class="enter">博客</h1>
    {{if .Posts}}
      <div class="post-list">
        {{range $i, $p := .Posts}}
          <div data-reveal {{if lt $i 4}}data-reveal-delay="{{$i}}"{{end}}>
            {{template "post-card" $p}}
          </div>
        {{end}}
      </div>
    {{else}}
      {{template "empty" (dict "Title" "还没有文章" "Desc" "稍后再来看看吧。")}}
    {{end}}
  </main>
  {{template "footer" .}}
</body>
</html>{{end}}
