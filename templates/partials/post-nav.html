{{define "post-nav"}}
{{/* 上一篇（更旧）/ 下一篇（更新）。用法：{{template "post-nav" .}}（PostData） */}}
{{if or .Prev .Next}}
<nav class="post-nav" aria-label="文章导航">
  {{with .Prev}}
  <a class="post-nav__item" href="/blog/{{.Slug}}/" rel="prev">
    <span class="post-nav__label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      上一篇
    </span>
    <span class="post-nav__title">{{.Title}}</span>
    <span class="post-nav__date">{{dateFormat .PubDate "2006-01-02"}}</span>
  </a>
  {{end}}

  {{with .Next}}
  <a class="post-nav__item post-nav__item--next" href="/blog/{{.Slug}}/" rel="next">
    <span class="post-nav__label">
      下一篇
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </span>
    <span class="post-nav__title">{{.Title}}</span>
    <span class="post-nav__date">{{dateFormat .PubDate "2006-01-02"}}</span>
  </a>
  {{end}}
</nav>
{{end}}
{{end}}
