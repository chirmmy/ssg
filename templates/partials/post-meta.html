{{define "post-meta"}}
<div class="post-meta">
  <span class="post-meta__item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><time datetime="{{dateFormat .PubDate "2006-01-02"}}">{{dateFormat .PubDate "2006-01-02"}}</time></span>
  {{if .ReadingTime}}
    <span class="post-meta__sep">·</span>
    <span class="post-meta__item">{{.ReadingTime}} 分钟阅读</span>
  {{end}}
  {{if .Tags}}
    <span class="post-meta__sep">·</span>
    <span class="post-meta__item">
      {{range $i, $t := .Tags}}{{if $i}}，{{end}}{{template "tag" $t}}{{end}}
    </span>
  {{end}}
</div>
{{end}}
