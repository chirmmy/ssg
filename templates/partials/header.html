{{define "header"}}
<header class="site-header">
  <div class="site-header__inner">
    <a href="/" class="site-header__brand">
      <span class="site-header__mark">
        <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <path d="M9 16V8l6 8V8"/>
        </svg>
      </span>
      <span class="site-header__name">{{.Site.Config.Site.Title}}</span>
    </a>

    <nav class="site-header__nav" id="site-nav" data-nav aria-label="主导航">
      <a href="/blog/"{{if eq .Current "blog"}} aria-current="page"{{end}}>博客</a>
      <a href="/about/"{{if eq .Current "about"}} aria-current="page"{{end}}>关于</a>
    </nav>

    <div class="site-header__actions">
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="切换主题"
      >
        <span class="theme-toggle__icon" data-theme-icon="auto" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3v18"></path>
            <path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"></path>
          </svg>
        </span>
        <span class="theme-toggle__icon" data-theme-icon="light" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </span>
        <span class="theme-toggle__icon" data-theme-icon="dark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
          </svg>
        </span>
      </button>
    </div>
  </div>

  {{if .ShowProgress}}
  <div class="site-header__progress" aria-hidden="true"><i data-progress-bar></i></div>
  {{end}}
</header>
{{end}}
