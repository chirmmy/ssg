{{define "header"}}
<header class="site-header">
  <div class="container container--wide site-header__inner">
    <a href="/" class="site-header__brand">
      <svg class="site-header__mark" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4"/>
        <path d="M9 16V8l6 8V8"/>
      </svg>
      <span class="site-header__name">{{.Site.Config.Site.Title}}</span>
    </a>

    <button
      type="button"
      class="nav-toggle"
      data-nav-toggle
      aria-label="打开菜单"
      aria-expanded="false"
      aria-controls="site-nav"
    >
      <svg
        class="nav-toggle__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 6h18M3 12h18M3 18h18"></path>
      </svg>
    </button>

    <nav
      class="site-header__nav"
      id="site-nav"
      data-nav
      aria-label="主导航"
    >
      <a href="/blog/">博客</a>
      <a href="/about/">关于</a>
    </nav>

    <div class="site-header__actions">
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="切换主题"
      >
        <span class="theme-toggle__icon" data-theme-icon="auto" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 3v18"></path>
            <path d="M12 3a9 9 0 0 1 0 18" fill="currentColor" stroke="none"></path>
          </svg>
        </span>
        <span class="theme-toggle__icon" data-theme-icon="light" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </span>
        <span class="theme-toggle__icon" data-theme-icon="dark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>
{{end}}
