{{define "post-card"}}
<article class="post-card">
  <div class="post-card__meta">
    <time datetime="{{dateFormat .PubDate "2006-01-02"}}">
      {{dateFormat .PubDate "2006-01-02"}}
    </time>
  </div>
  <h2>
    <a href="/blog/{{.Slug}}/">{{.Title}}</a>
  </h2>
  <p>{{.Description}}</p>
  <span class="post-card__more" aria-hidden="true">阅读全文 →</span>
</article>
{{end}}
