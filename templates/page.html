{{define "page"}}<!DOCTYPE html>
<html lang="{{.Site.Config.Site.Language}}">
<head>{{template "head" .}}</head>
<body>
  <a href="#main" class="skip-link">跳到主内容</a>
  {{template "header" .}}
  <main id="main" tabindex="-1">
    <article class="page">
      <h1 class="enter">{{.Page.Title}}</h1>
      <div class="content enter" data-enter-delay="1">
        {{.Page.Body}}
      </div>
    </article>
  </main>
  {{template "footer" .}}
</body>
</html>{{end}}
