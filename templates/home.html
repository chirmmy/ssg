{{define "home"}}<!DOCTYPE html>
<html lang="{{.Site.Config.Site.Language}}">
<head>{{template "head" .}}</head>
<body>
  <a href="#main" class="skip-link">跳到主内容</a>
  {{template "header" .}}
  <main id="main" tabindex="-1" class="home-main">
    <section class="hero-fullscreen">
      <canvas class="hero-fullscreen__canvas" data-hero-canvas data-hero-pacman aria-hidden="true"></canvas>
      <div class="hero-fullscreen__content" data-hero-content>
        <h1 class="hero-fullscreen__title" data-hero-text>{{.Site.Config.Site.Title}}</h1>
        <!-- <p class="hero-fullscreen__subtitle" data-hero-text>{{.Site.Config.Site.Description}}</p> -->
        <div class="hero-fullscreen__actions">
          <a href="/blog/" class="btn">阅读文章</a>
          <a href="/about/" class="btn ghost">关于我</a>
        </div>
      </div>

      <div class="hero-fullscreen__scroll-hint" aria-hidden="true">
        <span>向下滚动</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
      </div>
    </section>

    {{if .Posts}}
    <section class="home-latest">
      <h2>最新文章</h2>
      <div class="post-list">
        {{range $i, $p := .Posts}}
          <div data-reveal {{if lt $i 4}}data-reveal-delay="{{$i}}"{{end}}>
            {{template "post-card" $p}}
          </div>
        {{end}}
      </div>
    </section>
    {{end}}
  </main>
  {{template "footer" .}}
  <script src="{{asset "hero.js"}}" defer></script>
</body>
</html>{{end}}
